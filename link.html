<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>명경 (明鏡) - 내 운명을 비추는 거울</title>
  
  <meta name="description" content="명경 프라이빗 사주 해답소 및 개운템 추천" />
  
  <!-- 폰트 최적화 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Sans+KR:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <style>
    body { 
      background-color: #fcfbf9; 
      font-family: 'Noto Sans KR', sans-serif; 
      margin: 0; 
      padding: 0; 
      display: flex; 
      justify-content: center; 
      min-height: 100vh;
    }
    .link-container { 
      max-width: 480px; 
      width: 100%; 
      padding: 50px 20px 30px; 
      text-align: center; 
      box-sizing: border-box;
    }
    .profile-img { 
      width: 95px; 
      height: 95px; 
      border-radius: 50%; 
      object-fit: cover; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
      margin-bottom: 18px; 
      background-color: #2c2c2c;
      border: 3px solid #f0eee9;
    }
    .title { 
      font-family: 'Nanum Myeongjo', serif; 
      font-size: 1.45rem; 
      font-weight: 800; 
      color: #1a1a1a; 
      margin: 0 0 8px 0; 
      letter-spacing: 2px; 
    }
    .desc { 
      font-size: 0.95rem; 
      color: #666; 
      margin-bottom: 35px; 
      font-weight: 400; 
    }
    
    .link-btn { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      width: 100%; 
      padding: 18px 15px; 
      margin-bottom: 18px; 
      border-radius: 12px; 
      text-decoration: none; 
      font-size: 1.05rem; 
      font-weight: 600; 
      transition: all 0.3s ease; 
      position: relative; 
      box-sizing: border-box;
      letter-spacing: -0.5px;
    }
    
    /* 1번 메인 버튼: 운세 풀이 (기존 유입) */
    .btn-main { 
      background-color: #3e3a39; 
      color: #ffffff; 
      box-shadow: 0 4px 15px rgba(62,58,57,0.2); 
    }
    .btn-main:hover { background-color: #222; transform: translateY(-2px); }
    
    /* 2번 수익화 버튼: 어필리에이트/쿠팡 다이렉트 (강조) */
    .btn-shop { 
      background-color: #ffffff; 
      color: #903c31; 
      border: 2px solid #903c31; 
    }
    .btn-shop:hover { 
      background-color: #fffdfd; 
      transform: translateY(-2px); 
      box-shadow: 0 4px 15px rgba(144,60,49,0.15); 
    }
    
    /* 3번 서브 버튼: 체류시간 증가용 칼럼 */
    .btn-sub { 
      background-color: #f4f2ec; 
      color: #555; 
      border: none;
    }
    .btn-sub:hover { background-color: #ebe7de; transform: translateY(-2px); }

    /* 수익화 버튼 시선 강탈 배지 */
    .badge { 
      position: absolute; 
      top: -12px; 
      right: 10px; 
      background: #e53935; 
      color: white; 
      font-size: 0.75rem; 
      padding: 4px 10px; 
      border-radius: 15px; 
      font-weight: bold; 
      box-shadow: 0 2px 6px rgba(229,57,53,0.3); 
      animation: float-badge 2s ease-in-out infinite; 
    }
    
    @keyframes float-badge { 
      0% { transform: translateY(0); } 
      50% { transform: translateY(-4px); } 
      100% { transform: translateY(0); } 
    }
    
    .footer-text { margin-top: 40px; font-size: 0.75rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="link-container">
    <img src="https://cdn-icons-png.flaticon.com/512/3050/3050519.png" alt="명경 신녀" class="profile-img">
    <h1 class="title">명경 (明鏡)</h1>
    <p class="desc">답답한 현실, 내 운명의 흐름을 비추다.</p>
    
    <!-- 1. 메인 트래픽 (사주 풀이) -->
    <a href="https://myeongkyung-web.vercel.app" class="link-btn btn-main">
      🔍 1분 만에 내 무료 사주·운세 보기
    </a>
    
    <!-- 2. 즉각 수익화 트래픽 (어필리에이트 링크 삽입) -->
    <!-- href 안에 쿠팡 파트너스 링크 또는 네이버 쇼핑 기획전 링크를 넣으세요 -->
    <a href="[대표님의_브랜드커넥트_또는_쿠팡링크]" class="link-btn btn-shop">
      <span class="badge">HOT 특가</span>
      ✨ 내 사주의 부족한 기운 채우는 개운템
    </a>
    
    <!-- 3. 체류시간 증가 트래픽 (애드센스용) -->
    <a href="https://myeongkyung-web.vercel.app/column/saju-basics.html" class="link-btn btn-sub">
      📖 명경 사주 명리학 칼럼 읽기
    </a>
    
    <div class="footer-text">© 2026 MyeongKyung. All rights reserved.</div>
  </div>
</body>
</html>
